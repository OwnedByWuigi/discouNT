set timeout=5
set default=0
search --no-floppy --label DISCOUNT --set=root

insmod all_video
insmod gfxterm
if [ "$grub_platform" = "pc" ]; then
    insmod vbe
fi
set gfxmode=640x480x32
set gfxpayload=keep
terminal_output gfxterm

menuentry "discouNT (Serial debug)" {
    multiboot /SYSTEM32/NTOSKRNL.EXE debug
}

menuentry "discouNT (Screen debug)" {
    if [ "$grub_platform" = "pc" ]; then
        set gfxpayload=text
        terminal_output console
    else
        # UEFI has no legacy VGA text mode; retain its framebuffer.
        set gfxpayload=keep
    fi
    multiboot /SYSTEM32/NTOSKRNL.EXE screen-debug
}

menuentry "discouNT" {
    multiboot /SYSTEM32/NTOSKRNL.EXE
}

menuentry "Install discouNT (Native-mode Setup)" {
    multiboot /SYSTEM32/NTOSKRNL.EXE setup
}
