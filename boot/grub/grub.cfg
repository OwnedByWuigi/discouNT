set timeout=5
set default=0
search --no-floppy --label DISCOUNT --set=root

insmod all_video
insmod gfxterm
if [ "$grub_platform" = "pc" ]; then
    insmod vbe
fi
set gfxmode=640x480x32
set gfxpayload=keep
terminal_output gfxterm

menuentry "discouNT (debug)" {
    multiboot /SYSTEM32/NTOSKRNL.EXE debug
}

menuentry "discouNT" {
    multiboot /SYSTEM32/NTOSKRNL.EXE
}
